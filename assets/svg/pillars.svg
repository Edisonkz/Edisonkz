<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Qué construyo - Arquitectura End-to-End">
  <rect width="1200" height="320" rx="18" fill="#05070f" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="40" y="44" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2">// QUÉ CONSTRUYO</text>
  <text x="40" y="82" fill="#e9edf7" font-family="system-ui, sans-serif" font-size="32" font-weight="800">DESARROLLO DE SOFTWARE <tspan fill="#38bdf8">END-TO-END</tspan></text>

  <!-- Card 1 -->
  <rect x="40" y="108" width="356" height="180" rx="14" fill="#0b0f1c" stroke="#4ade80" stroke-opacity="0.4"/>
  <rect x="40" y="108" width="356" height="30" rx="14" fill="#101526"/>
  <circle cx="60" cy="123" r="4.5" fill="#ff5f57"/>
  <circle cx="75" cy="123" r="4.5" fill="#febc2e"/>
  <circle cx="90" cy="123" r="4.5" fill="#28c840"/>
  <text x="110" y="127" fill="#8b93a8" font-family="ui-monospace, Consolas, monospace" font-size="11">backend.sh</text>
  <text x="60" y="164" fill="#4ade80" font-family="ui-monospace, Consolas, monospace" font-size="12">$ spring-boot --clean-arch</text>
  <text x="60" y="196" fill="#e9edf7" font-family="system-ui, sans-serif" font-size="17" font-weight="700">Sistemas &amp; E-Commerce</text>
  <text x="60" y="222" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">Levantamiento de sistemas reales,</text>
  <text x="60" y="242" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">E-Commerce, Spring Boot y FastAPI con</text>
  <text x="60" y="262" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">Clean Architecture, JWT y ACID.</text>

  <!-- Card 2 -->
  <rect x="422" y="108" width="356" height="180" rx="14" fill="#0b0f1c" stroke="#a78bfa" stroke-opacity="0.45"/>
  <rect x="422" y="108" width="356" height="30" rx="14" fill="#101526"/>
  <circle cx="442" cy="123" r="4.5" fill="#ff5f57"/>
  <circle cx="457" cy="123" r="4.5" fill="#febc2e"/>
  <circle cx="472" cy="123" r="4.5" fill="#28c840"/>
  <text x="492" y="127" fill="#8b93a8" font-family="ui-monospace, Consolas, monospace" font-size="11">samsung_sic.py</text>
  <text x="442" y="164" fill="#a78bfa" font-family="ui-monospace, Consolas, monospace" font-size="12">$ python -m sic.ml_bigdata</text>
  <text x="442" y="196" fill="#e9edf7" font-family="system-ui, sans-serif" font-size="17" font-weight="700">IA, ML &amp; Big Data (SIC)</text>
  <text x="442" y="222" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">Samsung Innovation Campus: modelos</text>
  <text x="442" y="242" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">Machine Learning, Big Data, RAG</text>
  <text x="442" y="262" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">con LangChain, PyTorch y FastAPI.</text>

  <!-- Card 3 -->
  <rect x="804" y="108" width="356" height="180" rx="14" fill="#0b0f1c" stroke="#38bdf8" stroke-opacity="0.45"/>
  <rect x="804" y="108" width="356" height="30" rx="14" fill="#101526"/>
  <circle cx="824" cy="123" r="4.5" fill="#ff5f57"/>
  <circle cx="839" cy="123" r="4.5" fill="#febc2e"/>
  <circle cx="854" cy="123" r="4.5" fill="#28c840"/>
  <text x="874" y="127" fill="#8b93a8" font-family="ui-monospace, Consolas, monospace" font-size="11">cloud_saas.sh</text>
  <text x="824" y="164" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="12">$ docker compose up --oci</text>
  <text x="824" y="196" fill="#e9edf7" font-family="system-ui, sans-serif" font-size="17" font-weight="700">SaaS, PWA &amp; Cloud OCI</text>
  <text x="824" y="222" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">Clientes Angular PWA offline-first y React,</text>
  <text x="824" y="242" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">contenedores Docker y despliegue CI/CD</text>
  <text x="824" y="262" fill="#8b93a8" font-family="system-ui, sans-serif" font-size="13">en Oracle Cloud Infrastructure (OCI).</text>
</svg>
